name: Tests

on:
  push:
    branches: [ main, v4-rewrite ]
  pull_request:
    branches: [ main, v4-rewrite ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 2
  CARGO_NET_TIMEOUT: 10
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
        sudo rm -rf /usr/local/.ghcup /usr/local/lib/android
        sudo rm -rf /usr/local/share/powershell /usr/share/swift
        sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry & target
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-test-

    - name: Check formatting
      run: cargo fmt --all -- --check

    # Clippy with --all-targets compiles libs, tests, benches, examples, and bins.
    # Using dev profile (default) — no LTO/optimization overhead.
    # All subsequent steps reuse these artifacts via matching features + profile.
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    # Same --all-features as clippy so cargo reuses compiled artifacts.
    - name: Unit tests
      run: cargo test --workspace --all-features --lib --bins

    # Integration tests spawn example binaries (the `child_process` smoke test
    # execs `examples/hello_world`), and `--tests` alone never builds examples —
    # clippy above only type-checks them (metadata, no linked binaries). This
    # also guards that every example links.
    - name: Build examples
      run: cargo build --workspace --all-features --examples

    # Workspace-level integration / compliance tests live in `tests/` and per-crate
    # `tests/` directories. Pre-3.1 these were never executed in CI — only `--lib
    # --bins` ran, so ~600 integration tests across compliance, fault-injection,
    # transport conformance, and performance silently never ran.
    - name: Integration tests
      run: cargo test --workspace --all-features --tests

    # An explicit `--doc` force-runs doctests even for crates that opt out
    # with `doctest = false` (unlike a plain `cargo test`, which honors it).
    # turbomcp-protocol is the one opt-out: its @generated wire types carry the
    # spec's prose verbatim, and rustdoc misreads that indented/backticked text
    # as Rust code. Every other crate's doc examples must compile — the facade's
    # especially, since they are the API contract users read first.
    - name: Doc tests
      run: cargo test --workspace --all-features --doc --exclude turbomcp-protocol

    - name: Cleanup
      if: always()
      run: cargo clean 2>/dev/null || true

  # Everything above runs on Linux only. This job is the portability guard: MCP's
  # default transport is stdio over a spawned child process, and the largest MCP
  # host runs on Windows, so "it compiles on Linux" says nothing about the
  # platform most users will actually run a server on.
  #
  # Deliberately leaner than the Linux job: fmt, clippy, docs and the fuzz/wasm
  # guards are platform-independent, so re-running them here would only buy
  # minutes on the slowest runners. What is platform-*dependent* is whether the
  # code builds and the tests pass.
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # turbomcp-telemetry's `otlp` feature exports over gRPC (tonic), whose build
    # script needs protoc. The Linux jobs apt-get it; this installs the same tool
    # on both runners.
    - name: Install protoc
      uses: taiki-e/install-action@v2
      with:
        tool: protoc

    - name: Cache cargo registry & target
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-xplat-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-xplat-

    # Examples are built rather than only type-checked: the `child_process`
    # integration test execs one, and spawning a child is exactly the part of
    # this codebase most likely to differ per platform.
    - name: Build examples
      run: cargo build --workspace --all-features --examples

    - name: Tests
      run: cargo test --workspace --all-features --lib --bins --tests

  # `--all-features` and `--no-default-features` are both tested above, and
  # neither says anything about the combinations in between — which is what a
  # user actually compiles when they enable, say, `client` without `http`. A
  # `cfg` that only lines up at the extremes is the classic way a Rust library
  # breaks for everyone who didn't turn everything on.
  #
  # Scoped to the facade because that is where users choose features; depth 2
  # because it catches every pairwise interaction at a fraction of the full
  # powerset's cost. `--no-dev-deps` skips building the test harness for each
  # combination — this job is asking whether the *library* configures, and dev
  # dependencies would otherwise be rebuilt dozens of times.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack

    - name: Cache cargo registry & target
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-features-

    - name: Check every feature pair on the facade
      run: cargo hack check -p turbomcp --feature-powerset --depth 2 --no-dev-deps

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
        sudo rm -rf /usr/local/.ghcup /usr/local/lib/android

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    # All crates in this workspace declare `rust-version = "1.88"` (the real floor
    # imposed by dependencies: jsonwebtoken 10, time 0.3, tonic 0.14). The other
    # CI jobs use `stable`, so an MSRV regression (e.g. a newer-than-1.88 stdlib
    # API) would pass CI and break downstream consumers pinned to 1.88. This job
    # catches that.
    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@1.88

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-msrv-

    - name: cargo check at MSRV
      run: cargo check --workspace --all-features

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # Advisories (RUSTSEC), license policy, banned/duplicate crates, and source
    # provenance — all governed by deny.toml. Fails the build on a new
    # vulnerability or a disallowed license.
    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories bans licenses sources

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install nightly + cargo-fuzz
      uses: dtolnay/rust-toolchain@nightly
    - name: Install cargo-fuzz
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz

    # Short deterministic runs (not a soak): each target must build under the
    # sanitizer and survive a bounded run without a crash. Catches regressions
    # in the untrusted-input decoders (wire codec, Mcp-Param header sentinel,
    # URI-template matcher, and the sonic-vs-serde differential) on every
    # push. Longer campaigns run out of band.
    # The prebuilt cargo-fuzz binary is musl-linked, and cargo-fuzz defaults
    # --target to the triple *it* was compiled for — building the fuzz targets
    # for musl, where ASan is unsupported (statically linked libc). Pin the
    # build to the actual host triple.
    - name: Fuzz each target briefly
      working-directory: fuzz
      run: |
        HOST_TARGET="$(rustc +nightly -vV | sed -n 's/^host: //p')"
        for target in codec_decode mcp_header_codec uri_template sonic_decode; do
          echo "::group::fuzz $target"
          cargo +nightly fuzz run "$target" --target "$HOST_TARGET" -- -max_total_time=30 -rss_limit_mb=4096
          echo "::endgroup::"
        done

  wasm:
    name: WASM
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-wasm-

    # The no_std foundation crates must stay wasm32-portable. They build as
    # libraries (no .wasm artifact / no test runner on this target), so this is a
    # compile-only portability guard — the same one `just test` runs locally.
    - name: Build no_std foundation for wasm32
      run: cargo build -p turbomcp-core -p turbomcp-protocol --target wasm32-unknown-unknown

    # The same crates with default features off — the true no_std configuration
    # (std feature disabled, codec without sonic-rs). Guards the cfg(not(std))
    # code paths that the default build never compiles.
    - name: Build no-default-features foundation for wasm32
      run: cargo build -p turbomcp-core -p turbomcp-protocol -p turbomcp-codec --no-default-features --target wasm32-unknown-unknown

    - name: Test non-default foundation configs on the host
      run: cargo test -p turbomcp-core -p turbomcp-protocol -p turbomcp-codec --no-default-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v6

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
        sudo rm -rf /usr/local/lib/android /usr/local/share/powershell
        sudo apt-get clean

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-coverage-

    # `--all-targets`, not `--lib`: this suite is deliberately integration-heavy
    # — handlers are exercised through a real dispatcher and a real wire — so a
    # lib-only measurement counts almost none of it and reports ~54% against a
    # true ~90%.
    #
    # The excluded paths are code coverage cannot speak to: `@generated` wire
    # types (~400 emitted Default/From/Display impls the conversions never call;
    # their correctness is proven by the conformance suite and the round-trip
    # tests, not by line counts) and `turbomcp-codegen`, a build tool.
    - name: Generate coverage
      env:
        CARGO_TARGET_DIR: /tmp/cargo-coverage
        IGNORE_RE: '(tests?/|benches/|examples/|fuzz/|/(v2025_06_18|v2025_11_25|draft)/types\.rs|turbomcp-codegen/)'
      run: |
        set -euo pipefail
        cargo llvm-cov --workspace --all-features --all-targets \
          --lcov --output-path lcov.info --ignore-filename-regex "$IGNORE_RE"

        # Read the JSON totals rather than scraping a column out of the text
        # table. The previous `awk '{print $NF}'` picked up the *branch* column,
        # which llvm-cov renders as "-" when branch coverage isn't instrumented;
        # `bc` then failed, `[` errored, and the gate silently passed on every
        # run since it was added. Hence the explicit numeric check below.
        COVERAGE=$(cargo llvm-cov report --json --summary-only \
          --ignore-filename-regex "$IGNORE_RE" | jq -r '.data[0].totals.lines.percent')
        echo "Line coverage: ${COVERAGE}%"

        if ! printf '%s' "$COVERAGE" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
          echo "::error::could not parse a coverage percentage (got '${COVERAGE}')"
          exit 1
        fi

        MIN_COVERAGE=85
        if awk -v c="$COVERAGE" -v m="$MIN_COVERAGE" 'BEGIN { exit !(c < m) }'; then
          echo "::error::Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
          exit 1
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Rustdoc (docs.rs config)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    # docs.rs builds on nightly with `--cfg docsrs`; so does this. That is what
    # makes `#![cfg_attr(docsrs, feature(doc_cfg))]` and the per-item
    # `doc(cfg(feature = …))` labels compile, so a stale or malformed label
    # fails here rather than silently rendering wrong on docs.rs.
    - name: Install nightly
      uses: dtolnay/rust-toolchain@nightly

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-docs-

    # Broken intra-doc links are invisible until someone reads docs.rs, so any
    # rustdoc diagnostic is a failure. turbomcp-protocol is exempt for the same
    # reason it opts out of doctests: its @generated types embed the spec's
    # prose, which rustdoc misreads as code.
    - name: Build docs
      env:
        RUSTDOCFLAGS: --cfg docsrs -D warnings
      run: cargo doc --workspace --all-features --no-deps --exclude turbomcp-protocol

  semver:
    name: SemVer (public API)
    runs-on: ubuntu-latest
    # Self-activating: cargo-semver-checks needs a published baseline in the
    # same major to compare against, and 4.x has not shipped yet. Until it has,
    # the step reports that and passes; the first 4.x release on crates.io turns
    # it into a real gate with no further edits.
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-semver-checks

    - name: Check the public API against the last published 4.x
      run: |
        BASELINE=$(curl -sSf -H 'User-Agent: turbomcp-ci (nick@epistates.com)' \
          https://crates.io/api/v1/crates/turbomcp \
          | jq -r '[.versions[] | select(.yanked == false) | .num
                   | select(startswith("4."))] | first // empty')
        if [ -z "$BASELINE" ]; then
          echo "No published 4.x baseline yet — nothing to compare against."
          echo "This job becomes a real gate on the first 4.x crates.io release."
          exit 0
        fi
        echo "Comparing the public API against turbomcp $BASELINE"
        cargo semver-checks check-release \
          --package turbomcp \
          --baseline-version "$BASELINE"
