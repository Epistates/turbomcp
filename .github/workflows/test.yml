name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 2
  CARGO_NET_TIMEOUT: 10
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
        sudo rm -rf /usr/local/.ghcup /usr/local/lib/android
        sudo rm -rf /usr/local/share/powershell /usr/share/swift
        sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry & target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-test-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check maintained documentation links
      run: python3 scripts/check_docs.py

    # Clippy with --all-targets compiles libs, tests, benches, examples, and bins.
    # Using dev profile (default) — no LTO/optimization overhead.
    # All subsequent steps reuse these artifacts via matching features + profile.
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Renamed facade dependency
      run: cargo check --locked --manifest-path crates/turbomcp/tests/renamed_dependency/Cargo.toml
      env:
        CARGO_TARGET_DIR: target

    # Same --all-features as clippy so cargo reuses compiled artifacts.
    - name: Unit tests
      run: cargo test --workspace --all-features --lib --bins

    # Integration tests spawn example binaries (the `child_process` smoke test
    # execs `examples/hello_world`), and `--tests` alone never builds examples —
    # clippy above only type-checks them (metadata, no linked binaries). This
    # also guards that every example links.
    - name: Build examples
      run: cargo build --workspace --all-features --examples

    # Workspace-level integration / compliance tests live in `tests/` and per-crate
    # `tests/` directories. Pre-3.1 these were never executed in CI — only `--lib
    # --bins` ran, so ~600 integration tests across compliance, fault-injection,
    # transport conformance, and performance silently never ran.
    - name: Integration tests
      run: cargo test --workspace --all-features --tests

    # An explicit `--doc` force-runs doctests even for crates that opt out
    # with `doctest = false` (unlike a plain `cargo test`, which honors it).
    # turbomcp-protocol is the one opt-out: its @generated wire types carry the
    # spec's prose verbatim, and rustdoc misreads that indented/backticked text
    # as Rust code. Every other crate's doc examples must compile — the facade's
    # especially, since they are the API contract users read first.
    - name: Doc tests
      run: cargo test --workspace --all-features --doc --exclude turbomcp-protocol

    - name: Cleanup
      if: always()
      run: cargo clean 2>/dev/null || true

  # Everything above runs on Linux only. This job is the portability guard: MCP's
  # default transport is stdio over a spawned child process, and the largest MCP
  # host runs on Windows, so "it compiles on Linux" says nothing about the
  # platform most users will actually run a server on.
  #
  # Deliberately leaner than the Linux job: fmt, clippy and the wasm guard are
  # platform-independent, so re-running them here would only buy minutes on the
  # slowest runners. What is platform-*dependent* is whether the code builds and
  # the tests pass.
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # turbomcp-telemetry's `otlp` feature exports over gRPC (tonic), whose build
    # script needs protoc. The Linux jobs apt-get it; this installs the same tool
    # on both runners.
    - name: Install protoc
      uses: taiki-e/install-action@v2
      with:
        tool: protoc

    - name: Cache cargo registry & target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-xplat-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-xplat-

    # Examples are built rather than only type-checked: the `child_process`
    # integration test execs one, and spawning a child is exactly the part of
    # this codebase most likely to differ per platform.
    - name: Build examples
      run: cargo build --workspace --all-features --examples

    - name: Tests
      run: cargo test --workspace --all-features --lib --bins --tests

  # `--all-features` and `--no-default-features` are both tested above, and
  # neither says anything about the combinations in between — which is what a
  # user actually compiles when they enable, say, `client` without `http`. A
  # `cfg` that only lines up at the extremes is the classic way a Rust library
  # breaks for everyone who didn't turn everything on.
  #
  # Scoped to the facade because that is where users choose features; depth 2
  # because it catches every pairwise interaction at a fraction of the full
  # powerset's cost. `--no-dev-deps` skips building the test harness for each
  # combination — this job is asking whether the *library* configures, and dev
  # dependencies would otherwise be rebuilt dozens of times.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack

    - name: Cache cargo registry & target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-features-

    - name: Check every feature pair on the facade
      run: cargo hack check -p turbomcp --feature-powerset --depth 2 --no-dev-deps

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
        sudo rm -rf /usr/local/.ghcup /usr/local/lib/android

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    # All crates in this workspace declare `rust-version = "1.88"` (the real floor
    # imposed by dependencies: jsonwebtoken 10, time 0.3, tonic 0.14). The other
    # CI jobs use `stable`, so an MSRV regression (e.g. a newer-than-1.88 stdlib
    # API) would pass CI and break downstream consumers pinned to 1.88. This job
    # catches that.
    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@1.88

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-msrv-

    - name: cargo check at MSRV
      run: cargo check --workspace --all-features

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Advisories (RUSTSEC), license policy, banned/duplicate crates, and source
    # provenance — all governed by deny.toml. Fails the build on a new
    # vulnerability or a disallowed license.
    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories bans licenses sources

  drift:
    name: Generated artifacts
    runs-on: ubuntu-latest

    # Two kinds of checked-in artifact have a generator, and nothing verified
    # either still matched it. The wire types are `@generated` and CLAUDE.md says
    # never to hand-edit them, but that was a convention with no enforcement
    # behind it. The lockfiles are worse, because the failure already happened:
    # Dependabot opened PRs that bumped the *workspace* manifest from an excluded
    # crate's directory and left the root lockfile stale, and all ten jobs passed
    # because none of them builds `--locked`.
    steps:
    - uses: actions/checkout@v7

    # rustfmt because `just codegen` formats what it emits, and the checked-in
    # types are formatted — without it every file would "differ".
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-drift-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-drift-

    # The justfile is the single source of truth for which upstream revision the
    # wire types came from, so a local `just codegen` and this job cannot disagree
    # about it. Same arrangement the coverage job uses for its thresholds.
    - name: Resolve the pinned schema revision
      id: schema
      run: echo "ref=$(just --evaluate mcp_schema_ref)" >> "$GITHUB_OUTPUT"

    - name: Check out the MCP schema
      uses: actions/checkout@v7
      with:
        repository: modelcontextprotocol/modelcontextprotocol
        ref: ${{ steps.schema.outputs.ref }}
        path: mcp-schema
        persist-credentials: false

    - name: Wire types match the schema
      env:
        MCP_SCHEMA_ROOT: mcp-schema/schema
      run: just codegen-check

    - name: Lockfiles match the manifests
      run: just lock-check

    - name: No numeric JSON-RPC codes
      run: just codes-check

  wasm:
    name: WASM
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-wasm-

    # The no_std foundation crates must stay wasm32-portable. They build as
    # libraries (no .wasm artifact / no test runner on this target), so this is a
    # compile-only portability guard — the same one `just test` runs locally.
    - name: Build no_std foundation for wasm32
      run: cargo build -p turbomcp-core -p turbomcp-protocol --target wasm32-unknown-unknown

    # The same crates with default features off — the true no_std configuration
    # (std feature disabled, codec without sonic-rs). Guards the cfg(not(std))
    # code paths that the default build never compiles.
    - name: Build no-default-features foundation for wasm32
      run: cargo build -p turbomcp-core -p turbomcp-protocol --no-default-features --target wasm32-unknown-unknown

    - name: Test non-default foundation configs on the host
      run: cargo test -p turbomcp-core -p turbomcp-protocol --no-default-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v7

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
        sudo rm -rf /usr/local/lib/android /usr/local/share/powershell
        sudo apt-get clean

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    # The exclusion regex and the floor are read out of the justfile below, so
    # `just coverage-text` locally and this job can never disagree about what is
    # measured. They already had: the `draft` -> `v2026_07_28` module rename
    # updated the justfile and left this workflow silently counting ~9k lines of
    # @generated wire types.
    - name: Install just
      uses: taiki-e/install-action@just

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-coverage-

    # `--all-targets`, not `--lib`: this suite is deliberately integration-heavy
    # — handlers are exercised through a real dispatcher and a real wire — so a
    # lib-only measurement counts almost none of it and reports ~54% against a
    # true ~90%.
    #
    # The excluded paths are code coverage cannot speak to: `@generated` wire
    # types (~400 emitted Default/From/Display impls the conversions never call;
    # their correctness is proven by the conformance suite and the round-trip
    # tests, not by line counts) and `turbomcp-codegen`, a build tool.
    - name: Generate coverage
      env:
        CARGO_TARGET_DIR: /tmp/cargo-coverage
      run: |
        set -euo pipefail
        IGNORE_RE=$(just --evaluate coverage_ignore)
        MIN_COVERAGE=$(just --evaluate coverage_min)
        echo "Excluding: ${IGNORE_RE}"

        cargo llvm-cov --workspace --all-features --all-targets \
          --lcov --output-path lcov.info --ignore-filename-regex "$IGNORE_RE"

        # Read the JSON totals rather than scraping a column out of the text
        # table. The previous `awk '{print $NF}'` picked up the *branch* column,
        # which llvm-cov renders as "-" when branch coverage isn't instrumented;
        # `bc` then failed, `[` errored, and the gate silently passed on every
        # run since it was added. Hence the explicit numeric check below.
        COVERAGE=$(cargo llvm-cov report --json --summary-only \
          --ignore-filename-regex "$IGNORE_RE" | jq -r '.data[0].totals.lines.percent')
        echo "Line coverage: ${COVERAGE}%"

        if ! printf '%s' "$COVERAGE" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
          echo "::error::could not parse a coverage percentage (got '${COVERAGE}')"
          exit 1
        fi

        if awk -v c="$COVERAGE" -v m="$MIN_COVERAGE" 'BEGIN { exit !(c < m) }'; then
          echo "::error::Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
          exit 1
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The official MCP conformance suite (`@modelcontextprotocol/conformance`, a
  # Node CLI) driven against a live TurboMCP Streamable-HTTP server, once per
  # advertised revision. Its own job because `turbomcp-conformance` is excluded
  # from the workspace — own lockfile, own target dir, and a Node dependency the
  # main gate must not acquire.
  #
  # This is the only check that reads our wire the way another implementation
  # will. Nothing else in CI would notice, say, an error code moving.
  conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    # No `cache: pnpm` here: that keys off a pnpm-lock.yaml, and this suite has
    # no Node project — it `pnpm dlx`es a pinned package straight from the
    # registry. The step would fail looking for a lockfile that shouldn't exist.
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    # Keyed on this crate's own lockfile, and caching its own target dir — it
    # shares neither with the workspace.
    - name: Cache cargo registry & target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          crates/turbomcp-conformance/target/
        key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('crates/turbomcp-conformance/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-conformance-

    # Being outside the workspace also puts this crate outside the Lint & Test
    # job's `--workspace` fmt and clippy passes. Nothing else covers it, so it
    # is held to the same bar here.
    - name: Check formatting
      working-directory: crates/turbomcp-conformance
      run: cargo fmt -- --check

    - name: Clippy
      working-directory: crates/turbomcp-conformance
      run: cargo clippy --all-targets -- -D warnings

    # STRICT turns the "no pnpm on PATH" skip into a failure. Without it a
    # runner that lost its Node toolchain would report this job green having
    # verified nothing — the precise failure mode this suite exists to catch.
    #
    # Both directions run. The server suite scores the server the harness
    # connects to, the client suite scores the client it spawns, and passing
    # one says nothing about the other: the client's missing standalone SSE
    # stream survived every release precisely because only the server had ever
    # been measured.
    - name: Run the conformance suite (server)
      working-directory: crates/turbomcp-conformance
      env:
        TURBOMCP_CONFORMANCE_STRICT: '1'
      run: cargo test --test conformance_server -- --nocapture

    - name: Run the conformance suite (client)
      working-directory: crates/turbomcp-conformance
      env:
        TURBOMCP_CONFORMANCE_STRICT: '1'
      run: cargo test --test conformance_client -- --nocapture

  interop:
    name: Cross-SDK interop (rmcp, TypeScript, Python, Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Excluded from the workspace for its rmcp dependency tree, which is how it
    # ended up running nowhere while both READMEs claimed it ran "on every
    # change". Same shape of hole the conformance suite had, and the same fix.
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    # Keyed on this crate's own lockfile, and caching its own target dir — it
    # shares neither with the workspace.
    - name: Cache cargo registry & target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          crates/turbomcp-interop/target/
        key: ${{ runner.os }}-cargo-interop-${{ hashFiles('crates/turbomcp-interop/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-interop-

    # Outside the workspace is also outside the Lint & Test job's `--workspace`
    # fmt and clippy. Held to the same bar here, before it drifts.
    - name: Check formatting
      working-directory: crates/turbomcp-interop
      run: cargo fmt -- --check

    - name: Clippy
      working-directory: crates/turbomcp-interop
      run: cargo clippy --all-targets -- -D warnings

    # The peer SDKs of the HTTP matrix (`tests/sdk_matrix.rs`): the official
    # TypeScript, Python and Go SDKs, each from its own lockfile.
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: crates/turbomcp-interop/sdks/ts/package-lock.json

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache-dependency-path: crates/turbomcp-interop/sdks/go/go.sum

    - name: Install the TypeScript peer
      working-directory: crates/turbomcp-interop/sdks/ts
      run: npm ci

    # A missing toolchain skips its peers locally; here it is a failure.
    # Bounded inside the job, so a hang fails this step with its log (a job
    # that hits its own timeout is cancelled, and its log is lost).
    - name: Run the interop suite
      working-directory: crates/turbomcp-interop
      timeout-minutes: 15
      env:
        TURBOMCP_INTEROP_REQUIRE: '1'
      run: cargo test -- --nocapture

    # turbomcp's client and server against rmcp's, same process, interleaved,
    # medians compared. Shared runners are noisy, hence a looser factor than
    # the local default; the numbers are printed either way.
    - name: Performance parity with rmcp
      working-directory: crates/turbomcp-interop
      env:
        TURBOMCP_PERF: '1'
        TURBOMCP_PERF_FACTOR: '1.5'
      run: cargo test --release --test perf_parity -- --nocapture

  semver:
    name: SemVer (public API)
    runs-on: ubuntu-latest
    # Each crate is compared with its latest published 4.x. While the version
    # is a pre-release, semver-checks treats the bump as major and passes; it
    # becomes a real gate for patch and minor releases from 4.0.0 on.
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-semver-checks

    - name: Check every published crate against its last published 4.x
      # Every published crate's API is public, not just the facade's: a user
      # can depend on turbomcp-server directly, and VERSIONING.md promises
      # them the same review. A crate with no 4.x on crates.io yet (new, or
      # never released) has nothing to compare against and is skipped, and so
      # is turbomcp-macros: semver-checks reads rustdoc JSON, which a
      # proc-macro crate doesn't produce (its API is covered by the facade's).
      run: |
        crates=$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[] | select(.publish != [])
                   | select(any(.targets[]; .kind | index("lib"))) | .name')
        failed=0
        for crate in $crates; do
          baseline=$(curl -sSf -H 'User-Agent: turbomcp-ci (nick@epistates.com)' \
            "https://crates.io/api/v1/crates/$crate" 2>/dev/null \
            | jq -r '[.versions[] | select(.yanked == false) | .num
                     | select(startswith("4."))] | first // empty')
          if [ -z "$baseline" ]; then
            echo "::notice::$crate has no published 4.x baseline; skipped"
            continue
          fi
          echo "::group::$crate against $baseline"
          cargo semver-checks check-release --package "$crate" \
            --baseline-version "$baseline" || failed=1
          echo "::endgroup::"
        done
        exit $failed
