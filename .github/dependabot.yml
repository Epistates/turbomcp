version: 2

updates:
  # The workspace lockfile.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The OpenTelemetry crates version in lockstep: `tracing-opentelemetry`
      # 0.33 wants `opentelemetry` 0.32, which wants `opentelemetry_sdk` 0.32.
      # Bumped one at a time they cannot compile, so this group has to come
      # before the update-type groups below — the first match wins, and a
      # 0.x bump would otherwise be swept up as "minor".
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      # Patch and minor updates are reviewed as one PR: individually they are
      # noise, and CI passing across the batch is the signal that matters.
      # Majors stay separate — they are the ones that move MSRV or behaviour.
      cargo-minor:
        update-types: [minor, patch]
    # Held on purpose; each reason is beside the pin in the root Cargo.toml.
    # Revisit when the named dependents move, then lift the entry.
    ignore:
      # The digest 0.10 generation: axum's WebSocket (sha1) and oauth2 5 link
      # it, so 0.11 is a second RustCrypto stack, which deny.toml refuses.
      - dependency-name: hmac
        versions: [">= 0.13"]
      - dependency-name: sha2
        versions: [">= 0.11"]
      - dependency-name: chacha20poly1305
        versions: [">= 0.11"]
      # The version axum 0.8's `ws` feature uses: one tungstenite, not two.
      - dependency-name: tokio-tungstenite
        versions: [">= 0.30"]
      # turbomcp-codegen's 0.8: typify 0.8's API is schemars 0.8's types.
      # The workspace's schemars is 1.x and still takes minor updates.
      - dependency-name: schemars
        update-types: ["version-update:semver-major"]

  # turbomcp-conformance and turbomcp-interop are excluded from the workspace and
  # carry their own lockfiles, so nothing above reaches them. Only `rmcp` is
  # tracked here, and only by name.
  #
  # Both crates depend on the workspace crates by *path*, so Dependabot walks
  # into the parent workspace and treats the root `[workspace.dependencies]`
  # declarations as candidates too. Unrestricted, that produced PRs titled "bump
  # the interop group" carrying tower-http 0.6->0.7, base64 0.22->0.23 and
  # jsonwebtoken 10->11 across the whole workspace with the root Cargo.lock left
  # stale (#36, #38). `dependency-type: direct` does not separate them, because
  # those root declarations *are* direct, just in another manifest (#39, #40).
  # An allowlist by name does.
  #
  # rmcp earns its place: it is the official Rust SDK the interop suite tests
  # against, and a new release of it is the one dependency event here worth
  # hearing about. Everything else in these two lockfiles is a test-only dep of a
  # `publish = false` crate. Refresh those deliberately with `just refresh-locks`;
  # CI's `lock-check` guarantees they stay consistent with their manifests either
  # way.
  - package-ecosystem: cargo
    directory: /crates/turbomcp-interop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-name: rmcp

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    # Every action is pinned to a commit with its release in a trailing
    # comment; Dependabot moves both. release.yml is generated by dist, whose
    # plan job fails on a hand-edited copy: its pins live in
    # dist-workspace.toml (`[dist.github-action-commits]`), then `dist generate`.
    exclude-paths:
      - ".github/workflows/release.yml"
    ignore:
      # `dtolnay/rust-toolchain` has no releases, only branches: it is pinned to
      # a `master` commit and the toolchain is the `toolchain:` input. Dependabot
      # used to read `@1.88` as an action tag and proposed `@1.120`; had that
      # resolved, the MSRV job would have tested a newer compiler under a green
      # tick. Bump the commit deliberately, and `toolchain: '1.88'` alongside
      # `rust-version` in the manifests, per VERSIONING.md.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
