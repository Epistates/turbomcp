version: 2

updates:
  # The workspace lockfile.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The OpenTelemetry crates version in lockstep: `tracing-opentelemetry`
      # 0.33 wants `opentelemetry` 0.32, which wants `opentelemetry_sdk` 0.32.
      # Bumped one at a time they cannot compile, so this group has to come
      # before the update-type groups below — the first match wins, and a
      # 0.x bump would otherwise be swept up as "minor".
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      # Patch and minor updates are reviewed as one PR: individually they are
      # noise, and CI passing across the batch is the signal that matters.
      # Majors stay separate — they are the ones that move MSRV or behaviour.
      cargo-minor:
        update-types: [minor, patch]

  # The two suites excluded from the workspace carry their own lockfiles, so
  # nothing above reaches them. Grouped per crate: these are test surfaces
  # whose dependency bumps are almost never individually interesting, and the
  # first run of this config proved the point by opening four separate PRs for
  # four patch bumps.
  #
  # `allow: direct` is load-bearing, not tidiness. Both crates depend on the
  # workspace crates by *path*, so everything they pull in transitively resolves
  # its version through the root `[workspace.dependencies]` table — and to move
  # one of those, Dependabot edits the root manifest. Left unrestricted it opened
  # PRs titled "bump the interop group" that carried `tower-http` 0.6→0.7,
  # `base64` 0.22→0.23 and `jsonwebtoken` 10→11 across the whole workspace, with
  # the root `Cargo.lock` untouched. Restricting these two to their own direct
  # dependencies keeps workspace-wide bumps in the root ecosystem above, where
  # they arrive with a matching lockfile and get reviewed as what they are.
  - package-ecosystem: cargo
    directory: /crates/turbomcp-conformance
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-type: direct
    groups:
      conformance:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /crates/turbomcp-interop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-type: direct
    groups:
      interop:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    ignore:
      # `dtolnay/rust-toolchain@1.88` pins the *Rust* version to install, not a
      # version of the action — the ref is the toolchain. Dependabot reads it as
      # an action tag and "upgrades" it; the first run of this config proposed
      # `@1.120`, which does not exist. The visible failure is the lucky case:
      # had the ref resolved, the MSRV job would have quietly started testing
      # against a newer compiler and the 1.88 guarantee would have rotted with
      # a green tick. Bump this deliberately, alongside `rust-version` in the
      # manifests, per VERSIONING.md.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
