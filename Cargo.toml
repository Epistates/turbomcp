# Workspace-only Cargo.toml - main SDK is in crates/turbomcp

[workspace]
members = [
    "crates/turbomcp-core",
    "crates/turbomcp-protocol",
    "crates/turbomcp-service",
    "crates/turbomcp-server",
    "crates/turbomcp-client",
    "crates/turbomcp-transport-http",
    "crates/turbomcp-macros",
    "crates/turbomcp-codegen",
    "crates/turbomcp-auth",
    "crates/turbomcp-telemetry",
    "crates/turbomcp-ext-tasks",
    "crates/turbomcp",
]
# Excluded, separately-run test surfaces. Each carries its own lockfile and stays
# out of the main workspace lockfile/gate (`just test`):
#   - turbomcp-interop:     cross-SDK interop vs rmcp (heavy rmcp dep tree).
#   - turbomcp-conformance: official MCP conformance suite (Node harness driver).
# Run them on their own (`cd crates/<crate> && cargo test`).
exclude = ["crates/turbomcp-interop", "crates/turbomcp-conformance"]
resolver = "2"

[workspace.lints.clippy]
# Quality enforcement - warn on missing documentation for error conditions
# This helps users understand what can go wrong when calling fallible functions
# TODO(v4.0.0): Consider changing to "deny" after comprehensive doc coverage
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
items_after_statements = "allow"
single_match_else = "allow"
match_same_arms = "allow"
similar_names = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
struct_excessive_bools = "allow"
uninlined_format_args = "allow"
# Allow test-specific patterns
assertions_on_constants = "allow"
const_is_empty = "allow"

[workspace.dependencies]
# Core async runtime and utilities
# Tokio: no features at the workspace level. Workspace features are additive
# for every `tokio = { workspace = true }` member, so listing them here leaked
# `process`, `signal` and `net` into crates that need none of them. Each crate
# opts into what it uses.
tokio = { version = "1.52" }
tokio-util = { version = "0.7.18" }
futures = "0.3.32"
pin-project-lite = "0.2.17"

# URI template (RFC 6570) matching for #[resource("…/{var}")] — the pattern core
regex = "1.11"
percent-encoding = "2.3"

# Serialization with performance focus. `float_roundtrip` makes serde_json's
# float *parsing* correctly rounded (without it, extreme-exponent values like
# 2.5e-308 gain 1 ulp on decode — wire fidelity is worth the small parse cost).
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value", "preserve_order", "float_roundtrip"] }
sonic-rs = "0.5.8"   # High-performance JSON (core `simd` codec)

# Schema validation and generation
schemars = { version = "1.2.1" }
jsonschema = { version = "0.58", default-features = false }

# HTTP/WebSocket/Network
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "rustls", "http2", "brotli", "gzip", "form", "query"] }
eventsource-stream = "0.2.3"
axum = { version = "0.8.9", features = ["tracing"] }
# The header types axum and reqwest share, for the HTTP transport's names.
http = "1.4"
mime = "0.3.17"
tower = { version = "0.5.3", features = ["util", "retry", "timeout"] }
# Only CORS is used; compression/trace/timeout/limit pulled brotli, flate2 and
# async-compression into every HTTP server build for nothing.
tower-http = { version = "0.7.1", default-features = false, features = ["cors"] }
# 0.29 is the version axum's `ws` feature uses: one tungstenite stack, not two.
tokio-tungstenite = { version = "0.29.0", default-features = false }

# Error handling and diagnostics
thiserror = "2.0.18"
async-trait = "0.1.89"
anyhow = "1.0.102"

# Observability and monitoring
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["tonic", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }

# URL
url = "2.5.8"
# RFC 3986 parsing where WHATWG `url` (and its IDNA/ICU stack) is not
# needed; jsonschema already links it.
fluent-uri = "0.4.1"
# CIDR parsing and containment for the outbound authorization network policy.
ipnet = "2.12"

# Security and authentication
subtle = "2.6"  # Constant-time comparison for secret values
# HMAC-SHA-256. The digest 0.10 generation, not 0.11: the WebSocket handshake
# (sha1, via tungstenite) and oauth2 already link digest 0.10, so 0.11 would
# put a second copy of the RustCrypto stack in every build that has either.
hmac = "0.12"
sha2 = "0.10"
# MRTR requestState sealing. 0.10, the generation sha2/hmac share (0.11
# moves to crypto-common 0.2; all of them move together).
chacha20poly1305 = "0.10"
# Wipes secrets on drop. Already linked (rustls, aws-lc-rs, the AEAD).
zeroize = "1.8"
# RFC 8785 canonical JSON, for the MRTR request binding.
serde_json_canonicalizer = "0.3"
# OS randomness for keys (uuid already links it).
getrandom = "0.4"
base64 = "0.23.1"
uuid = { version = "1.23", features = ["v4"] }
# OAuth 2.1 client flows (auth-code + PKCE + token exchange); HTTP is supplied
# by our reqwest adapter, so no default features.
oauth2 = { version = "5", default-features = false }
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs", "use_pem"] }

# Time and date handling (RFC 3339 timestamps on task records)
time = { version = "0.3.47", features = ["serde", "macros"] }

# Memory and performance optimizations
bytes = "1.11.1"

# Caching
moka = { version = "0.12.15", default-features = false }

# Rate limiting (lock-free GCRA, replaces hand-rolled token bucket / sliding window)
# Without the defaults' `jitter` (rand) and `dashmap` (a second hashbrown):
# the keyed limiter keeps its type over a mutex-guarded map.
governor = { version = "0.10.4", default-features = false, features = ["std", "quanta"] }

# Development and testing
criterion = { version = "0.8.2", features = ["html_reports"] }
trybuild = "1.0"
insta = { version = "1.47", features = ["json", "redactions"] }

# Internal workspace crate dependencies.
# `default-features = false` on turbomcp-core / turbomcp-protocol keeps the
# no_std/WASM foundation portable (their `default = ["std"]` is opt-in per
# crate), which also keeps core's sonic-rs `simd` codec out of the SDK's default
# build; the facade's `simd` feature is the opt-in.
turbomcp = { version = "4.0.0-alpha.5", path = "crates/turbomcp" }
turbomcp-core = { version = "4.0.0-alpha.5", path = "crates/turbomcp-core", default-features = false }
turbomcp-protocol = { version = "4.0.0-alpha.5", path = "crates/turbomcp-protocol", default-features = false }
turbomcp-service = { version = "4.0.0-alpha.5", path = "crates/turbomcp-service" }
turbomcp-server = { version = "4.0.0-alpha.5", path = "crates/turbomcp-server" }
turbomcp-client = { version = "4.0.0-alpha.5", path = "crates/turbomcp-client" }
turbomcp-transport-http = { version = "4.0.0-alpha.5", path = "crates/turbomcp-transport-http", default-features = false }
turbomcp-macros = { version = "4.0.0-alpha.5", path = "crates/turbomcp-macros" }
turbomcp-auth = { version = "4.0.0-alpha.5", path = "crates/turbomcp-auth" }
turbomcp-telemetry = { version = "4.0.0-alpha.5", path = "crates/turbomcp-telemetry" }
turbomcp-ext-tasks = { version = "4.0.0-alpha.5", path = "crates/turbomcp-ext-tasks" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"  # Full backtraces but ~60% smaller debug info vs debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# CI-optimized profile for disk space constrained environments
[profile.ci]
inherits = "release"
opt-level = "s"  # Optimize for size
lto = "thin"     # Thin LTO uses less disk space
codegen-units = 16  # More units = less memory but parallel builds
debug = false    # No debug info to save space
strip = true     # Strip symbols
panic = "abort"  # Smaller binaries

# WASM-optimized profile for smallest binary size
[profile.wasm-release]
inherits = "release"
opt-level = "z"      # Aggressive size optimization
lto = "fat"          # Full LTO for maximum size reduction
codegen-units = 1    # Single codegen unit for better optimization
panic = "abort"      # Smaller panic handling
strip = true         # Strip all symbols

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.test]
opt-level = 1
debug = "line-tables-only"

# Examples are in the individual crates
# Note: Workspace-level benchmarks are in benches/ directory
# Run with: ./scripts/run_benchmarks.sh

