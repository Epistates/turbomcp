[package]
name = "turbomcp-grpc"
version = "3.6.0"
edition = "2024"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "gRPC transport for TurboMCP - high-performance MCP over HTTP/2"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "grpc", "tonic", "protocol", "transport"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"
rust-version = "1.89.0"

[dependencies]
# gRPC framework
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tonic-prost = "0.14"
prost = "0.14"

# Async utilities
async-stream = "0.3"

# Async runtime
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }

# Internal dependencies
turbomcp-core = { workspace = true, features = ["std"] }
turbomcp-types = { workspace = true, features = ["experimental-tasks"] }
turbomcp-protocol = { workspace = true, features = ["experimental-tasks"] }

# Tower integration
tower = { workspace = true }
http = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = "0.1"

# Utilities

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.27"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"

[features]
default = ["server", "client", "tls"]
server = []
client = []
# rustls for tonic: `Server::tls_config` on the server side, and `https://`
# endpoints verified against the platform's root certificates on the client.
tls = ["tonic/tls-aws-lc", "tonic/tls-native-roots"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
