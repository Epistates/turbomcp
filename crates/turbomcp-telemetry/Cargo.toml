[package]
name = "turbomcp-telemetry"
version = "3.5.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
description = "OpenTelemetry integration and observability for TurboMCP SDK"
repository = "https://github.com/Epistates/turbomcp"
documentation = "https://docs.rs/turbomcp-telemetry"
homepage = "https://turbomcp.org"
keywords = ["mcp", "opentelemetry", "telemetry", "tracing", "metrics"]
categories = ["development-tools::debugging", "development-tools::profiling", "asynchronous"]
readme = "README.md"

[dependencies]
# Tracing foundation (always required)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# OpenTelemetry core (optional)
opentelemetry = { version = "0.32", default-features = false, optional = true, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, optional = true, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, optional = true, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.33", optional = true }

# Prometheus metrics (alternative to OTLP)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true, default-features = false, features = ["http-listener"] }

# Tower integration
tower = { workspace = true, optional = true }
tower-service = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }

# HTTP types
http = "1.5"

# Serialization
serde_json = "1.0"

# Utilities
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower ={ version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[features]
default = []

# JSON vs. pretty log output is a runtime choice (`TelemetryConfig::json_logs`),
# not a cargo feature: both formatters are always compiled in.

# OpenTelemetry integration (OTLP export over HTTP/protobuf)
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry"
]

# Prometheus metrics (standalone, without OpenTelemetry)
prometheus = ["dep:metrics", "dep:metrics-exporter-prometheus"]

# Tower middleware integration
tower = ["dep:tower", "dep:tower-service", "dep:futures-util"]

# Full telemetry stack
full = ["opentelemetry", "prometheus", "tower"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
