[package]
name = "turbomcp-telemetry"
version = "4.0.0-alpha.5"
edition = "2024"
rust-version = "1.88"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "TurboMCP v4 telemetry: OpenTelemetry, W3C Trace Context, metrics."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "opentelemetry", "tracing", "metrics"]
categories = ["development-tools::debugging", "network-programming"]

[dependencies]
turbomcp-core = { workspace = true }
# The closed set of MCP method names that metric labels are drawn from.
turbomcp-protocol = { workspace = true }
turbomcp-service = { workspace = true }
turbomcp-client = { workspace = true, optional = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
pin-project-lite = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Keyed redaction of subjects and session ids (HMAC-SHA256).
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }

# The OTLP export pipeline (gRPC via tonic) + a turnkey subscriber installer.
# Off by default: the TraceContextLayer + W3C propagation + redaction work with
# any `tracing` subscriber and pull no network/runtime deps.
opentelemetry-otlp = { workspace = true, optional = true, features = ["metrics"] }
tracing-subscriber = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
# `ClientTelemetry`: client spans, `mcp.client.operation.duration`, and trace
# context injected into each request's `_meta`.
client = ["dep:turbomcp-client"]
otlp = [
    "dep:opentelemetry-otlp",
    "opentelemetry-otlp/grpc-tonic",
    # OTLP/HTTP (protobuf): the async reqwest client the rest of the stack
    # already links, with rustls for an https collector.
    "opentelemetry-otlp/http-proto",
    "opentelemetry-otlp/reqwest-client",
    "opentelemetry-otlp/reqwest-rustls",
    "dep:tracing-subscriber",
    "dep:tokio",
]

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-util"] }
# A real client and server, for the end-to-end trace test.
turbomcp-server = { workspace = true }
turbomcp-protocol = { workspace = true }
# The in-memory exporters, to assert what the layers actually record.
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing"] }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true
# Lights the `doc(cfg)` labels that name the feature behind each gated item.
rustdoc-args = ["--cfg", "docsrs"]
