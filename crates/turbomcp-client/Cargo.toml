[package]
name = "turbomcp-client"
version = "4.0.0-alpha.5"
edition = "2024"
rust-version = "1.88"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "TurboMCP v4 client: ClientBuilder, ConnectMode probe, MRTR loop, SEP-2549 response cache."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "client", "llm", "ai"]
categories = ["network-programming", "asynchronous", "api-bindings"]

[dependencies]
tokio-util = { workspace = true, features = ["rt"] }
turbomcp-core = { workspace = true, features = ["std"] }
turbomcp-protocol = { workspace = true }
turbomcp-service = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "io-util", "macros"] }
futures = { workspace = true }
# Validates `structuredContent` against the tool's declared `outputSchema`.
jsonschema = { workspace = true }

[dev-dependencies]
turbomcp-server = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
async-trait = { workspace = true }

[lints]
workspace = true
