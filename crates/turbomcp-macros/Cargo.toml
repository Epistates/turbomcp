[package]
name = "turbomcp-macros"
version = "3.5.1"
edition = "2024"
description = "Procedural macros for ergonomic MCP tool and resource registration"
license = "MIT"
authors = ["Nicholas Paterno <nick@epistates.com>"]
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "macros", "procedural", "derive", "codegen"]
categories = ["development-tools"]
readme = "README.md"
rust-version = "1.89.0"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full", "extra-traits", "parsing", "visit"] }
proc-macro-crate = "3.5"

# The code the macros generate names its dependencies through the user's
# `turbomcp` (see `proc-macro-crate`); a proc-macro crate's own dependencies are
# invisible to it. Depending on the runtime crates here only compiled them a
# second time, for the host.

[dev-dependencies]
trybuild = "1.0"
# The compile_fail cases import it.
turbomcp-protocol = { workspace = true }

[features]
default = []
# Accepted for compatibility; the macros don't read them.
http = ["axum"]
tcp = ["tokio"]
unix = ["tokio"]
experimental-tasks = []
axum = []
tokio = []
