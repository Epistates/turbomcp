[package]
name = "turbomcp-transport-http"
version = "4.0.0-alpha.5"
edition = "2024"
rust-version = "1.88"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "TurboMCP v4 Streamable HTTP transport: the axum server endpoint and the reqwest client transport."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "http", "sse", "axum", "transport"]
categories = ["network-programming", "web-programming::http-server", "web-programming::http-client", "asynchronous"]

[features]
default = ["server"]
# The axum endpoint: `router`, `serve_http`, `HttpConfig`.
server = ["dep:axum", "dep:ipnet", "dep:mime", "dep:tower", "dep:tower-http", "dep:uuid", "tokio/net"]
# `HttpClientTransport` for turbomcp-client, and `connect_http`.
client = [
    "dep:reqwest",
    "dep:eventsource-stream",
    "dep:turbomcp-client",
    "dep:turbomcp-protocol",
    "dep:tokio-util",
    "dep:async-trait",
    "tokio/time",
    "tokio/macros",
    # Dialing out (`wss://` too), when `websocket` is on.
    "tokio-tungstenite?/connect",
    "tokio-tungstenite?/rustls-tls-native-roots",
]
# The challenge-driven OAuth 2.1 bearer source (`oauth::OAuthSession`).
oauth = ["client", "dep:turbomcp-auth", "turbomcp-auth/oauth-client"]
# WebSocket (not an MCP-spec transport): with `server`, a route on the HTTP
# endpoint (`HttpConfig::with_websocket`); with `client`,
# `WebSocketClientTransport` (`wss://` included).
# The server side needs nothing axum's `ws` doesn't already compile.
websocket = ["axum?/ws", "dep:tokio-tungstenite"]

[dependencies]
turbomcp-core = { workspace = true, features = ["std"] }
turbomcp-service = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
bytes = { workspace = true }
# server
# CIDR ranges for trusted proxies.
ipnet = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
mime = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
# client
turbomcp-client = { workspace = true, optional = true }
turbomcp-protocol = { workspace = true, optional = true }
turbomcp-auth = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
async-trait = { workspace = true, optional = true }
# websocket
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
turbomcp-protocol = { workspace = true }
turbomcp-server = { workspace = true }
turbomcp-auth = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "macros", "time"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
# Lights the `doc(cfg)` labels that name the feature behind each gated item.
rustdoc-args = ["--cfg", "docsrs"]
