[package]
name = "turbomcp-transport-traits"
version = "3.5.1"
edition = "2024"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "Core transport traits and types for TurboMCP - foundation for all transport implementations"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "transport", "traits", "async"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"
rust-version = "1.89.0"

[dependencies]
# Core dependencies
bytes = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
# Line framing for the stream transports (feature `codec`)
tokio-util = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Protocol types (for MessageId)
turbomcp-protocol = { workspace = true }

[dev-dependencies]

[features]
default = []
# `codec::BoundedLines`, the size-limited line framing the stdio, TCP and Unix
# transports share.
codec = ["dep:tokio-util"]
