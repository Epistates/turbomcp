[package]
name = "turbomcp-service"
version = "4.0.0-alpha.5"
edition = "2024"
rust-version = "1.88"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "TurboMCP v4 service layer: McpService, Transport trait, shared RPC middleware."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "tower", "service", "middleware"]
categories = ["network-programming", "asynchronous"]

[dependencies]
turbomcp-core = { workspace = true, features = ["std"] }
tower = { workspace = true }
tracing = { workspace = true }
# `FutureExt::catch_unwind`, so a panicking handler still answers its request.
futures = { workspace = true }
governor = { workspace = true, optional = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "io-std", "io-util"] }
# `StreamReader`, the stdin reader thread's channel as an `AsyncRead`.
tokio-util = { workspace = true, features = ["io"] }

[features]
# `GovernorRateLimiter`, the in-process rate limiter the HTTP transport's
# `server` feature turns on. Stdio is never rate limited, so a stdio-only
# build doesn't link it.
governor = ["dep:governor"]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "io-util",
] }

[package.metadata.docs.rs]
all-features = true
# Lights the `doc(cfg)` labels that name the feature behind each gated item.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
