[package]
name = "turbomcp-service"
version = "4.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "TurboMCP v4 service layer: McpService, Transport trait, shared RPC middleware."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "tower", "service", "middleware"]
categories = ["network-programming", "asynchronous"]

[dependencies]
turbomcp-core = { workspace = true }
turbomcp-codec = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
# `FutureExt::catch_unwind`, so a panicking handler still answers its request.
futures = { workspace = true }
governor = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "io-util",
] }

[package.metadata.docs.rs]
all-features = true
