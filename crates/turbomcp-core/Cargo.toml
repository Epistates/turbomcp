[package]
name = "turbomcp-core"
version = "4.0.0-alpha.5"
edition = "2024"
rust-version = "1.88"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "TurboMCP v4 foundation: ProtocolVersion, JsonRpcMessage, RequestContext, Identity, McpError. no_std + alloc."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "protocol", "no_std", "wasm"]
categories = ["no-std", "encoding"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# `float_roundtrip`: correctly rounded float parsing, so the codec does not
# gain an ulp on values like 2.5e-308 (the workspace build enables it anyway).
serde_json = { version = "1", default-features = false, features = ["alloc", "float_roundtrip"] }
hashbrown = { version = "0.17", features = ["serde"] }
bytes = { version = "1.11.1", default-features = false }
# std-only: CancellationToken integration lives behind the `std` feature.
tokio-util = { workspace = true, optional = true }

# SIMD-accelerated JSON for the codec; native x86_64/aarch64 only.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
sonic-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["std"] }

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "bytes/std", "dep:tokio-util"]
# sonic-rs as the codec's `DefaultCodec` on native x86_64/aarch64 (serde_json
# stays the portable baseline, and the only codec on wasm32).
simd = ["std", "dep:sonic-rs"]
# Construct RequestContext in downstream unit tests (F-SC-4 / round-3).
test-util = []

[package.metadata.docs.rs]
all-features = true
# Lights the `doc(cfg)` labels that name the feature behind each gated item.
rustdoc-args = ["--cfg", "docsrs"]
