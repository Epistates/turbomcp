[package]
name = "turbomcp-conformance"
version = "4.0.0-alpha.2"
edition = "2024"
rust-version = "1.88"
description = "Runs the official MCP conformance suite (@modelcontextprotocol/conformance) against TurboMCP's server and client."
license = "MIT"
publish = false

# NOTE: this crate is `exclude`d from the parent workspace (see the root
# Cargo.toml) so it never touches the main lockfile/gate. It carries its own
# Cargo.lock and is run directly:
#
#     just conformance                                    # from the repo root
#     cd crates/turbomcp-conformance && cargo test        # skips without pnpm
#
# Two suites, opposite directions:
#
#   tests/conformance_server.rs — the harness is the client. It drives an
#     in-process TurboMCP Streamable-HTTP server (`conformance server --url …`).
#   tests/conformance_client.rs — the harness is the server. It stands up a
#     mock server per scenario and runs the `conformance-client` binary below
#     against it (`conformance client --command …`).
#
# `pnpm` must be on PATH for either.

# Driven by the harness's `client` mode, one process per scenario. It is a real
# binary rather than a test because the harness spawns it: the scenario name
# arrives in `MCP_CONFORMANCE_SCENARIO` and the mock server's URL as argv[1].
[[bin]]
name = "conformance-client"
path = "src/bin/conformance_client.rs"

[dependencies]
turbomcp = { path = "../turbomcp", features = ["http", "client", "client-oauth"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The auth scenarios need the authorization redirect *without* following it:
# the harness's mock authorization server auto-approves and 302s to our
# redirect URI, and that Location header is the authorization response.
#
# Kept on the same version and TLS backend as the workspace's `reqwest`, since
# the `OAuthClient` this hands its client to is built against that one.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "io-util"] }
schemars = "1"
base64 = "0.23"
