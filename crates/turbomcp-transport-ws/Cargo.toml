[package]
name = "turbomcp-transport-ws"
version = "4.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
authors = ["Nicholas Paterno <nick@epistates.com>"]
description = "TurboMCP v4 WebSocket transport."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"
homepage = "https://turbomcp.org"
keywords = ["mcp", "websocket", "transport"]
categories = ["network-programming", "web-programming::websocket", "asynchronous"]

[dependencies]
turbomcp-core = { workspace = true, features = ["std"] }
turbomcp-codec = { workspace = true }
turbomcp-service = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-util"] }
serde_json = { workspace = true }
tower = { workspace = true }

[package.metadata.docs.rs]
all-features = true
# Lights the `doc(cfg)` labels that name the feature behind each gated item.
rustdoc-args = ["--cfg", "docsrs"]
