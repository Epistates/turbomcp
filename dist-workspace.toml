[workspace]
members = ["cargo:."]

# Release binaries for the `turbomcp` command (crates/turbomcp-cli), built by
# `.github/workflows/release.yml` when a version tag is pushed. That workflow
# is generated: change this file, then run `dist generate`.
#
# Crates are still published by hand with `cargo publish --workspace`, and the
# GitHub release is still written by hand from the CHANGELOG: the workflow only
# uploads binaries to it. Create the release (a draft is fine) before or with
# the tag; if the tag lands first, the upload job fails and re-running it once
# the release exists finishes the job.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax). Linux ships
# both libcs: glibc for performance where it exists, a static musl build for
# everything else (Alpine, distroless, old distros).
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Upload to the release written by hand rather than generating one
create-release = false
# Attest build provenance for every artifact (`gh attestation verify`)
github-attestations = true

# The release workflow runs with `id-token: write` and `attestations: write`, so
# every action in it is pinned to a commit: a tag can be moved to new code, a
# commit cannot. Keep these in step with the pins in `test.yml`.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
